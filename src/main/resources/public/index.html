<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockSmith Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>BlockSmith</h1>
        <p class="tagline">A blockchain node dashboard</p>
    </header>

    <main>
        <section id="network">
            <h2>Network</h2>
            <div id="network-stats" class="stats"></div>
            <div id="peers"></div>
        </section>

        <section id="blocks">
            <h2>Blocks</h2>
            <div id="block-list"></div>
        </section>
    </main>

    <footer>
        <p id="refresh-status" class="refresh">Connecting&hellip;</p>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
