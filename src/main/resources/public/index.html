<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockSmith Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script>
        // Set the theme before first paint to avoid a flash of the wrong palette.
        (function () {
            var t;
            try { t = localStorage.getItem("bs_theme"); } catch (e) {}
            if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
            if (t === "light") document.documentElement.setAttribute("data-theme", "light");
        })();
    </script>
</head>
<body>
<div id="app">
    <canvas id="bg" aria-hidden="true"></canvas>

    <!-- TOP BAR -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">&#9874;</span>BlockSmith
        </div>

        <button id="palette-trigger" class="palette-trigger" data-tour="palette" type="button">
            <span class="palette-icon" aria-hidden="true">&#8984;</span>
            <span class="palette-placeholder">Run a command &mdash; mine, send, deploy&hellip;</span>
            <span class="kbd">&#8984;K</span>
        </button>

        <div id="sync" class="sync">
            <span class="dot dot-green"></span><span id="sync-text">connecting&hellip;</span>
        </div>

        <button id="theme-toggle" class="icon-btn" type="button" title="Toggle light / dark">&#9681;</button>
        <button id="help-btn" class="icon-btn" type="button" title="Restart the tour">?</button>
    </header>

    <!-- MAIN -->
    <main class="main">
        <div class="main-inner">

            <!-- CHAIN HERO -->
            <section class="hero" data-tour="chain">
                <div class="hero-head">
                    <span class="hero-title">The chain</span>
                    <span id="hero-meta" class="hero-meta mono"></span>
                    <button id="mine-btn" class="btn-accent" type="button">
                        <span aria-hidden="true">&#9935;</span> Mine block
                    </button>
                </div>
                <div id="chain-row" class="chain-row"></div>
            </section>

            <!-- BOTTOM GRID -->
            <div class="grid">
                <section class="panel feed" data-tour="feed">
                    <div class="panel-label">Activity feed</div>
                    <div id="feed-list" class="scroll-col"></div>
                </section>

                <section class="panel actions" data-tour="actions">
                    <div class="panel-label">Actions</div>
                    <button class="action-btn" data-action="send" type="button"><span aria-hidden="true">&#8599;</span> Send transaction</button>
                    <button class="action-btn" data-action="wallet" type="button"><span aria-hidden="true">&#65291;</span> Create wallet</button>
                    <button class="action-btn" data-action="deploy" type="button"><span aria-hidden="true">&#9636;</span> Deploy contract</button>
                    <button class="action-btn" data-action="multisig" type="button"><span aria-hidden="true">&#10697;</span> Multisig wallet</button>
                </section>

                <section class="side" data-tour="side">
                    <div class="panel balance-card">
                        <div class="card-label">Balance</div>
                        <div class="balance-value"><span id="balance-amount">&mdash;</span> <span class="balance-unit">BSC</span></div>
                        <div id="balance-address" class="mono balance-address">no active wallet</div>
                    </div>
                    <div class="panel contracts-card">
                        <div class="card-label">Open contracts</div>
                        <div id="contract-list" class="scroll-col"></div>
                    </div>
                </section>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-inner mono">
            <span>BlockSmith Node</span>
            <span class="footer-sep">&middot;</span>
            <span id="footer-p2p">P2P &mdash;</span>
            <span id="footer-api">API &mdash;</span>
            <span id="footer-health" class="footer-health"><span class="dot dot-green"></span>chain healthy</span>
        </div>
    </footer>

    <!-- Overlay roots: palette, drawer, toast, tour are built by app.js -->
    <div id="overlay-root"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
